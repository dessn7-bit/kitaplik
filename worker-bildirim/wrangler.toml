# kitaplik-bildirim — alıntı tekrarı push hatırlatması (kitaplik-ara'dan AYRI worker)
name = "kitaplik-bildirim"
main = "worker.js"
compatibility_date = "2026-08-01"

[triggers]
crons = ["0 * * * *"]

# KV id'si "wrangler kv namespace create" çıktısıyla doldurulacak
[[kv_namespaces]]
binding = "KV"
id = "34745c0204f64b259f0750c323768515"

[vars]
# VAPID GENEL anahtarı — kamuya açık, uygulamada da duruyor.
